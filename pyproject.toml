[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbox"
version = "0.1.0"
description = "Offline Raspberry Pi music player controlled via hardware buttons, RFID tags and a Plotly Dash web interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "playbox" }]
keywords = ["raspberry-pi", "rfid", "music-player", "dash", "wm8960", "rc522"]

# Everything needed to run the web app and player logic. Installable on any
# machine — the hardware services degrade to no-ops when GPIO/SPI are absent,
# so the app still runs on a dev PC.
#
# On the Pi these come from apt (python3-mpv, python3-yaml) and are already
# satisfied inside a --system-site-packages venv, so only `dash` is fetched.
dependencies = [
    "dash>=2.16",
    "python-mpv>=1.0.5",
    "PyYAML>=6.0",
]

# The Pi-only libraries (gpiozero, spidev, lgpio, rpi-lgpio) are NOT listed
# here on purpose: they all ship as prebuilt apt packages on Raspberry Pi OS,
# which avoids compiling anything on a Zero 2W. See README section 2.
#
# The one pip package needed on the Pi beyond the above is the RFID driver:
#     pip install --no-deps pi-rc522
# `--no-deps` because pi-rc522 hard-depends on RPi.GPIO, which would collide
# with the apt-installed rpi-lgpio that provides the same `RPi.GPIO` import
# name (backed by lgpio, and the one that actually works on this kernel).

[project.scripts]
playbox = "playbox.__main__:main"

[project.urls]
Homepage = "https://github.com/playbox/playbox"

[tool.hatch.build.targets.wheel]
# Maps src/playbox -> playbox in the wheel. Non-Python files inside the package
# (defaults/*.yaml, web/assets/*.css) are included automatically, so the default
# configs ship as package data and can seed config/ on first run.
packages = ["src/playbox"]
